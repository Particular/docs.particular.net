name: PullRequest
on: pull_request
env:
  DOTNET_NOLOGO: true
  DOTNET_ROLL_FORWARD: Major
defaults:
  run:
    shell: bash
jobs:
  content-verification:
    name: Content verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
        # Caching is done to limit data transfer on each PR, not to optimize CI speed
      - name: Cache docstool
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages/particular.docstool
          key: docstool-${{ hashFiles('.config/dotnet-tools.json') }}
      - name: Restore docstool
        run: dotnet tool restore
      - name: Run docstool
        run: dotnet docstool test --no-version-check
  integrity-tests:
    name: Integrity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Run integrity tests
        run: dotnet test tests/IntegrityTests/IntegrityTests.csproj --configuration Release --logger "GitHubActions;report-warnings=false"
  build-projects:
    name: Build samples & snippets
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Build affected samples & snippets
        shell: pwsh
        run: pwsh.exe -NoLogo -NonInteractive -File .\tools\build-samples-and-snippets.ps1
