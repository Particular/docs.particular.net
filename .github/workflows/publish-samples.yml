name: Publish
on:
  push:
    branches: master
env:
  DOTNET_NOLOGO: true
permissions:
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  publish-samples:
    name: Publish Samples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
        # Caching is done to limit data transfer on each PR, not to optimize CI speed
      - name: Cache docstool
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages/particular.docstool
          key: docstool-${{ hashFiles('.config/dotnet-tools.json') }}
      - name: Restore docstool
        run: dotnet tool restore
      - name: Run docstool
        run: dotnet docstool test --no-version-check --zipfiles --out ~/build-output
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_OPENID_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_OPENID_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_OPENID_SUBSCRIPTION_ID }}
      - name: Publish Samples
        shell: pwsh
        run: az storage blob upload-batch `
                --source ~/build-output `
                --destination zips `
                --account-name particulardocs `
                --pattern "*.zip" `
                --overwrite `
                --auth-mode login `
                --no-progress
