name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .config/dotnet-tools.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .config/dotnet-tools.json

jobs:
  copilot-setup-steps:
    name: Copilot setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_ROLL_FORWARD: Major
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      # Caching is done to limit data transfer for Copilot sessions.
      - name: Cache docstool
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages/particular.docstool
          key: docstool-${{ hashFiles('.config/dotnet-tools.json') }}

      - name: Restore docstool
        run: dotnet tool restore

      - name: Verify docstool is available
        run: dotnet docstool --version
